crons:
  - name: port-accrual
    description: "Credits Entry/Unity Port daily earnings and Level Income every day at 1 AM India time"
    cron: "0 1 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/port-accrual"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
